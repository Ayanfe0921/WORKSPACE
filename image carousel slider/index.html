<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="carousel">
      <div class="image-container" id="imgs">
        <img src="https://picsum.photos/id/1015/500/300" alt="Landscape 1" />
        <img src="https://picsum.photos/id/1018/500/300" alt="Landscape 2" />
        <img src="https://picsum.photos/id/1025/500/300" alt="Landscape 3" />
        <img src="https://picsum.photos/id/1035/500/300" alt="Landscape 4" />
      </div>

      <div class="buttons-container">
        <button id="left" class="btn">Prev</button>
        <button id="right" class="btn">Next</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

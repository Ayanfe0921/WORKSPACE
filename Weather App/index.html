<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <div class="search">
        <input
          type="text"
          id="city-input"
          placeholder="Enter city name..."
          spellcheck="false"
        />
        <button id="search-btn">Search</button>
      </div>

      <div class="weather" id="weather" style="display: none">
        <h1 id="temp">22°c</h1>
        <h2 id="city">Lagos</h2>
        <p id="description">Clear Sky</p>

        <div class="details">
          <div class="col">
            <div>
              <p id="humidity">50%</p>
              <p>Humidity</p>
            </div>
          </div>
          <div class="col">
            <div>
              <p id="wind">15 km/h</p>
              <p>Wind Speed</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>

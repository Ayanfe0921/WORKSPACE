<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <h2>Tip Calculator</h2>
      
      <div class="input-group">
        <label for="bill">Bill Amount ($)</label>
        <input type="number" id="bill" placeholder="0.00" min="0" step="0.01" />
      </div>

      <div class="input-group">
        <label for="tip">Tip Percentage (%)</label>
        <input type="number" id="tip" value="15" min="0" />
      </div>

      <div class="input-group">
        <label for="people">Number of People</label>
        <input type="number" id="people" value="1" min="1" />
      </div>

      <div class="results">
        <div class="result-row">
          <span>Tip Amount (per person):</span>
          <strong id="tip-amount">$0.00</strong>
        </div>
        <div class="result-row">
          <span>Total Amount (per person):</span>
          <strong id="total-amount">$0.00</strong>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
